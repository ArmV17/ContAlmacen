<ion-app>
  <!-- ion-split-pane permite que el menú sea visible en PC y colapsable en Celular -->
  <ion-split-pane contentId="main-content" [when]="sesionIniciada()">
    
    <!-- El Menú Lateral: Solo se activa si hay una sesión iniciada -->
    <ion-menu contentId="main-content" type="overlay" *ngIf="sesionIniciada()">
      <ion-header class="ion-no-border">
        <ion-toolbar class="toolbar-elegante">
          <ion-title>CAMPS</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content class="fondo-claro">
        <ion-list class="lista-menu" lines="none">
          <ion-menu-toggle auto-hide="false">
            
            <!-- Opción: Inicio -->
            <ion-item routerLink="/dashboard" routerDirection="root" class="item-menu" routerLinkActive="seleccionado">
              <ion-icon slot="start" name="home-outline"></ion-icon>
              <ion-label>Inicio</ion-label>
            </ion-item>
            
            <!-- Opción: Nuevo Préstamo -->
            <ion-item routerLink="/nuevo-prestamo" routerDirection="root" class="item-menu" routerLinkActive="seleccionado">
              <ion-icon slot="start" name="add-circle-outline"></ion-icon>
              <ion-label>Nuevo Préstamo</ion-label>
            </ion-item>
            
            <!-- Opción: Devoluciones -->
            <ion-item routerLink="/devoluciones" routerDirection="root" class="item-menu" routerLinkActive="seleccionado">
              <ion-icon slot="start" name="checkmark-circle-outline"></ion-icon>
              <ion-label>Devoluciones</ion-label>
            </ion-item>
            
            <!-- Opción: Inventario -->
            <ion-item routerLink="/inventario" routerDirection="root" class="item-menu" routerLinkActive="seleccionado">
              <ion-icon slot="start" name="list-outline"></ion-icon>
              <ion-label>Inventario</ion-label>
            </ion-item>

            <!-- Opción: ADMINISTRACIÓN (FILTRADO POR ROL ADMIN) -->
            <ion-item *ngIf="esAdmin()" routerLink="/administracion" routerDirection="root" class="item-menu" routerLinkActive="seleccionado">
              <ion-icon slot="start" name="settings-outline"></ion-icon>
              <ion-label>Administración</ion-label>
            </ion-item>

            <!-- SEPARADOR -->
            <div class="menu-divider"></div>

            <!-- Botón: CERRAR SESIÓN -->
            <ion-item (click)="cerrarSesion()" class="item-menu logout-btn" button="true">
              <ion-icon slot="start" name="log-out-outline" color="danger"></ion-icon>
              <ion-label color="danger">Cerrar Sesión</ion-label>
            </ion-item>

          </ion-menu-toggle>
        </ion-list>
      </ion-content>
    </ion-menu>

    <!-- Contenedor principal de las páginas -->
    <ion-router-outlet id="main-content"></ion-router-outlet>
    
  </ion-split-pane>
</ion-app>
