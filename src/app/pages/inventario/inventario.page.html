<ion-header class="ion-no-border">
  <ion-toolbar class="toolbar-elegante">
    <ion-buttons slot="start">
      <ion-menu-button color="light"></ion-menu-button>
    </ion-buttons>
    <ion-title>Inventario</ion-title>
  </ion-toolbar>
  
  <!-- Barra de búsqueda universal -->
  <ion-toolbar class="toolbar-elegante barra-busqueda-container">
    <ion-searchbar 
      class="busqueda-limpia" 
      placeholder="Buscar por nombre o tipo..."
      [(ngModel)]="textoBuscar"
      animated="true">
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content class="fondo-claro ion-padding">
  <div class="contenedor-maximo">
    
    <!-- Mensaje si no hay resultados -->
    <div *ngIf="inventarioFiltrado.length === 0" class="mensaje-vacio-busqueda">
      <ion-icon name="search-outline"></ion-icon>
      <p>No se encontraron herramientas con ese nombre o tipo.</p>
    </div>

    <!-- Lista Minimalista Agrupada -->
    <div class="lista-minimalista" *ngIf="inventarioFiltrado.length > 0">
      
      <!-- Bloque por Herramienta (Ej. Pala) -->
      <div class="grupo-herramienta" *ngFor="let herramienta of inventarioFiltrado">
        
        <!-- Título alineado con las filas de abajo -->
        <div class="encabezado-grupo">
          <ion-icon name="construct-outline"></ion-icon>
          <h2 class="nombre-principal">{{ herramienta.nombre }}</h2>
        </div>

        <!-- Desglose por tipos -->
        <div class="cuerpo-grupo">
          <div class="fila-tipo" *ngFor="let detalle of herramienta.detallesPorTipo">
            
            <div class="info-izquierda">
              <span class="etiqueta-tipo">Tipo:</span>
              <!-- Espacio controlado antes del valor (Corta, Larga, etc) -->
              <span class="valor-dinamico">{{ detalle.tipo }}</span>
            </div>
            
            <div class="info-derecha">
              <ion-badge class="badge-stock-minimal">
                En stock {{ detalle.disponibles }}
              </ion-badge>
              
              <!-- Aviso visual si no hay stock -->
              <ion-text color="danger" *ngIf="detalle.disponibles === 0">
                <small class="texto-agotado">Agotado</small>
              </ion-text>
            </div>

          </div>
        </div>
        
      </div>
    </div>

  </div>
</ion-content>
