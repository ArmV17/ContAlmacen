<ion-header class="ion-no-border">
  <ion-toolbar class="toolbar-elegante">
    <ion-buttons slot="start">
      <ion-menu-button color="light"></ion-menu-button>
    </ion-buttons>
    <ion-title>Inventario</ion-title>
  </ion-toolbar>
  
  <!-- Barra de búsqueda conectada a la función buscarHerramienta -->
  <ion-toolbar class="toolbar-elegante barra-busqueda-container">
    <ion-searchbar 
      class="busqueda-limpia" 
      placeholder="Buscar por código o nombre..."
      (ionInput)="buscarHerramienta($event)">
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content class="fondo-claro ion-padding">
  <div class="contenedor-maximo">
    
    <!-- Mensaje por si la búsqueda no encuentra nada -->
    <div *ngIf="herramientasFiltradas.length === 0" class="mensaje-vacio-busqueda">
      <p>No se encontraron herramientas.</p>
    </div>

    <!-- Ciclo iterando sobre herramientasFiltradas en lugar de herramientas -->
    <ion-list class="lista-transparente" *ngIf="herramientasFiltradas.length > 0">
      <ion-item *ngFor="let item of herramientasFiltradas" class="item-limpio" lines="none">
        <div class="icono-contenedor" slot="start">
          <ion-icon name="build-outline"></ion-icon>
        </div>
        
        <ion-label>
          <!-- Nombres de columnas reales de Supabase -->
          <h3 class="herramienta-nombre">{{ item.nombre_herramienta }}</h3>
          <p class="herramienta-info">Código: {{ item.num_herramienta }}</p>
        </ion-label>
        
        <ion-badge slot="end" class="etiqueta-estado" 
          [ngClass]="{
            'estado-disponible': item.estado === 'Disponible',
            'estado-prestado': item.estado === 'Prestado',
            'estado-mantenimiento': item.estado === 'Mantenimiento'
          }">
          {{ item.estado }}
        </ion-badge>
      </ion-item>
    </ion-list>

  </div>
</ion-content>
