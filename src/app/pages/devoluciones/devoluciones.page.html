<ion-header class="ion-no-border">
  <ion-toolbar class="toolbar-elegante">
    <ion-title>Devoluciones</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="fondo-claro ion-padding">
  <div class="contenedor-maximo ion-margin-top">

    <!-- BUSCADOR DE DEUDORES -->
    <ion-card class="tarjeta-formulario animated fadeIn">
      <ion-card-content>
        <ion-item class="input-limpio" lines="none">
          <ion-label position="stacked">Matrícula o ID Maestro</ion-label>
          <ion-input [(ngModel)]="busquedaId" 
                     (ionInput)="filtrarLista()" 
                     placeholder="Buscar deudor..."
                     inputmode="numeric">
          </ion-input>
        </ion-item>
      </ion-card-content>
    </ion-card>

    <!-- ESTADO VACÍO -->
    <div *ngIf="prestamosAgrupados.length === 0 && !cargando" class="ion-text-center ion-padding animated fadeIn">
      <ion-icon name="checkmark-done-circle-outline" size="large" color="success" style="font-size: 80px; opacity: 0.5;"></ion-icon>
      <p style="color: #64748b; font-weight: 600;">No hay herramientas pendientes</p>
    </div>

    <!-- LISTADO DE PRÉSTAMOS ACTIVOS -->
    <h2 class="subtitulo-gestion" *ngIf="prestamosAgrupados.length > 0">Préstamos Activos</h2>

    <ion-list class="lista-transparente">
      <ion-item *ngFor="let grupo of prestamosAgrupados" class="item-gestion ion-margin-bottom" lines="none">
        <ion-label>
          <h3 class="nombre-maestro">{{ grupo.receptor_nombre }}</h3>
          
          <div class="info-secundaria">
            <ion-badge class="badge-id">ID: {{ grupo.receptor_id }}</ion-badge>
            <span class="tipo-badge">{{ grupo.receptor_tipo | uppercase }}</span>
          </div>

          <!-- CONTENEDOR DE VALIDACIÓN (ESCÁNER O MANUAL) -->
          <div class="seccion-validacion-devolucion">
            <ion-item class="input-limpio mini" lines="none">
              <ion-icon name="barcode-outline" slot="start" color="primary"></ion-icon>
              <!-- Conversión automática a mayúsculas mediante (ionInput) -->
              <ion-input [(ngModel)]="grupo.inputValidacion" 
                         (ionInput)="validarHerramientaEnGrupo(grupo)" 
                         (keyup.enter)="validarHerramientaEnGrupo(grupo)"
                         placeholder="Escanee o escriba código (Ej: PAL-01)">
              </ion-input>
            </ion-item>

            <!-- LISTA DE HERRAMIENTAS DEL PRÉSTAMO -->
            <div class="lista-check-herramientas">
              <div *ngFor="let h of grupo.datos_devolucion" 
                   class="check-item-devolucion" 
                   [class.validado]="h.validado">
                
                <div class="info-h">
                  <ion-icon [name]="h.validado ? 'checkmark-circle' : 'time-outline'" 
                            [color]="h.validado ? 'success' : 'medium'"></ion-icon>
                  <div class="textos-h">
                    <span class="nombre-h">{{ h.nombre }}</span>
                    <span class="codigo-h">({{ h.codigo }})</span>
                  </div>
                </div>
                
                <!-- BOTÓN INDIVIDUAL PARA ENTREGA PARCIAL INMEDIATA -->
                <ion-button *ngIf="h.validado" 
                            fill="clear" 
                            size="small" 
                            color="success" 
                            (click)="devolverUna(grupo, h)"
                            class="animated zoomIn">
                  <ion-icon name="arrow-undo-outline" slot="start"></ion-icon>
                  Entregar
                </ion-button>
              </div>
            </div>
          </div>
        </ion-label>

        <!-- BOTÓN DE ENTREGA GRUPAL DINÁMICO -->
        <ion-button slot="end" 
                    class="boton-recibir-grupo" 
                    color="success"
                    (click)="recibirSeleccion(grupo)"
                    [disabled]="!grupo.alMenosUnaValidada">
          <ion-icon name="checkmark-done-circle-outline" slot="start"></ion-icon>
          Entregar ({{ obtenerConteoValidados(grupo) }})
        </ion-button>
      </ion-item>
    </ion-list>

    <div style="height: 50px;"></div>
  </div>
</ion-content>
